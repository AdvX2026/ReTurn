name: ci

on:
  push:
    branches: [main, feat/**, chore/**]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          # node:sqlite without --experimental-sqlite needs ≥22.13
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit + HTTP smoke)
        run: pnpm test

      - name: Build
        run: pnpm build

  swift:
    name: Swift · macOS test · iOS build
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test macOS
        run: |
          xcodebuild clean test \
            -project apps/ReTurn/ReTurn.xcodeproj \
            -scheme ReTurn \
            -destination 'platform=macOS' \
            -skip-testing:ReTurnUITests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Simulator
        run: |
          xcodebuild clean build \
            -project apps/ReTurn/ReTurn.xcodeproj \
            -scheme ReTurn \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
