name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          # node:sqlite without --experimental-sqlite needs ≥22.13
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit + HTTP smoke)
        run: pnpm test

      - name: Build
        run: pnpm build

  apple_changes:
    name: detect · Apple changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_apple: ${{ steps.diff.outputs.run_apple }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Apple changes
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            echo "run_apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          fi

          if git diff --quiet "$range" -- \
            clients/apple \
            ':(exclude)clients/apple/notice.md' \
            packages/shared/src/api.ts \
            packages/shared/src/domain.ts \
            .github/workflows/ci.yml
          then
            echo "run_apple=false" >> "$GITHUB_OUTPUT"
          else
            # A matching change or an invalid diff range must run the safe path.
            echo "run_apple=true" >> "$GITHUB_OUTPUT"
          fi

  # Detector failures intentionally skip the Apple runner; the required gate below fails closed.
  swift_apple:
    name: Swift · Apple platform tests
    needs: apple_changes
    if: ${{ needs.apple_changes.outputs.run_apple == 'true' }}
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Test macOS
        run: |
          xcodebuild clean test \
            -project clients/apple/ReTurn.xcodeproj \
            -scheme ReTurn \
            -destination 'platform=macOS' \
            -skip-testing:ReTurnUITests \
            -resultBundlePath "$RUNNER_TEMP/ReTurn-macOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test iOS Simulator
        run: |
          xcodebuild clean test \
            -project clients/apple/ReTurn.xcodeproj \
            -scheme ReTurn \
            -destination 'platform=iOS Simulator,OS=26.5,name=iPhone 17 Pro' \
            -skip-testing:ReTurnUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/ReTurn-iOS.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Xcode results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-results-apple-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ReTurn-macOS.xcresult
            ${{ runner.temp }}/ReTurn-iOS.xcresult
          if-no-files-found: warn
          retention-days: 7

  # Keep this job name stable: main branch protection requires this aggregate check.
  swift:
    name: Swift · macOS + iOS tests
    needs: [apple_changes, swift_apple]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DETECT_RESULT: ${{ needs.apple_changes.result }}
      RUN_APPLE: ${{ needs.apple_changes.outputs.run_apple }}
      APPLE_RESULT: ${{ needs.swift_apple.result }}

    steps:
      - name: Verify Apple checks
        shell: bash
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Apple change detection ended with $DETECT_RESULT."
            exit 1
          fi

          if [[ "$RUN_APPLE" == "true" ]]; then
            if [[ "$APPLE_RESULT" == "success" ]]; then
              echo "Apple changes detected; the macOS and iOS tests passed."
              exit 0
            fi
            echo "::error::Apple changes require the platform test job to pass (Apple=$APPLE_RESULT)."
            exit 1
          fi

          if [[ "$RUN_APPLE" == "false" ]]; then
            if [[ "$APPLE_RESULT" == "skipped" ]]; then
              echo "No Apple changes detected; the platform test job was skipped."
              exit 0
            fi
            echo "::error::Unexpected Apple job result (Apple=$APPLE_RESULT)."
            exit 1
          fi

          echo "::error::Apple change detection returned an invalid value: $RUN_APPLE"
          exit 1
