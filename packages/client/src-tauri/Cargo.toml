[package]
name = "return_client"
version = "0.1.0"
description = "ReTurn desktop UI shell (Tauri 2)"
authors = ["ReTurn"]
edition = "2021"

[lib]
name = "return_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
